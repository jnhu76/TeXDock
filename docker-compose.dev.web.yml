# 开发环境 override 文件
# 用法：docker compose -f docker-compose.yml -f docker-compose.dev.web.yml up
# 挂载本地 web 源码和共享库，用于前端/后端开发调试
#
# 注意：不要挂载整个 services/web 目录，否则会覆盖镜像中 public/ 下的 webpack 编译产物，
# 导致 manifest.json 缺失、前端 502 错误。
# 只挂载后端源码（app/）和配置（config/），前端改动需在容器内运行 webpack 编译。

services:
  sharelatex:
    image: fred1653/sharelatex-full:latest
    volumes:
      - ~/sharelatex_data:/var/lib/overleaf
      - ./services/web/app:/overleaf/services/web/app
      - ./services/web/config:/overleaf/services/web/config
      - ./libraries:/overleaf/libraries
