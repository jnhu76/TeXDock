# docker-compose.dev.web.yml
#
# Development overlay for web/code changes.
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.web.yml up -d
#
# Mounts local source into the container for live development.
# Do NOT mount the entire services/web directory — it overwrites compiled assets.

services:
  sharelatex:
    image: "${TEXDOCK_FULL_IMAGE:-texdock/sharelatex-full:latest}"
    volumes:
      - "${TEXDOCK_OVERLEAF_DATA_DIR:?set TEXDOCK_OVERLEAF_DATA_DIR in .env}:/var/lib/overleaf"
      - ./services/web/app:/overleaf/services/web/app
      - ./services/web/config:/overleaf/services/web/config
      - ./services/web/modules:/overleaf/services/web/modules
      - ./services/clsi/app:/overleaf/services/clsi/app
      - ./services/clsi/config:/overleaf/services/clsi/config
      - ./libraries:/overleaf/libraries
