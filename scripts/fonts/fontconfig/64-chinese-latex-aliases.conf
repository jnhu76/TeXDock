<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>

  <!--
    Chinese LaTeX compatibility aliases.

    These aliases do NOT install Microsoft fonts.
    They only map common Windows font family names to open-source alternatives.

    If real SimSun / SimHei / KaiTi / FangSong fonts are installed later
    through fonts.zip, fontconfig should prefer the real exact family match.
  -->

  <alias>
    <family>SimSun</family>
    <prefer>
      <family>Noto Serif CJK SC</family>
      <family>FandolSong</family>
      <family>AR PL UMing CN</family>
      <family>Source Han Serif SC</family>
    </prefer>
  </alias>

  <alias>
    <family>NSimSun</family>
    <prefer>
      <family>Noto Serif CJK SC</family>
      <family>FandolSong</family>
      <family>AR PL UMing CN</family>
      <family>Source Han Serif SC</family>
    </prefer>
  </alias>

  <alias>
    <family>SimHei</family>
    <prefer>
      <family>Noto Sans CJK SC</family>
      <family>FandolHei</family>
      <family>WenQuanYi Zen Hei</family>
      <family>Source Han Sans SC</family>
    </prefer>
  </alias>

  <alias>
    <family>KaiTi</family>
    <prefer>
      <family>FandolKai</family>
      <family>AR PL UKai CN</family>
      <family>Noto Serif CJK SC</family>
      <family>Source Han Serif SC</family>
    </prefer>
  </alias>

  <alias>
    <family>FangSong</family>
    <prefer>
      <family>FandolFang</family>
      <family>Noto Serif CJK SC</family>
      <family>AR PL UMing CN</family>
      <family>Source Han Serif SC</family>
    </prefer>
  </alias>

  <alias>
    <family>Microsoft YaHei</family>
    <prefer>
      <family>Noto Sans CJK SC</family>
      <family>WenQuanYi Micro Hei</family>
      <family>FandolHei</family>
      <family>Source Han Sans SC</family>
    </prefer>
  </alias>

  <alias>
    <family>Microsoft JhengHei</family>
    <prefer>
      <family>Noto Sans CJK TC</family>
      <family>Noto Sans CJK SC</family>
      <family>WenQuanYi Micro Hei</family>
    </prefer>
  </alias>

  <alias>
    <family>PMingLiU</family>
    <prefer>
      <family>Noto Serif CJK TC</family>
      <family>Noto Serif CJK SC</family>
      <family>AR PL UMing CN</family>
    </prefer>
  </alias>

  <alias>
    <family>MingLiU</family>
    <prefer>
      <family>Noto Serif CJK TC</family>
      <family>Noto Serif CJK SC</family>
      <family>AR PL UMing CN</family>
    </prefer>
  </alias>

  <alias>
    <family>Arial</family>
    <prefer>
      <family>Arial</family>
      <family>Liberation Sans</family>
      <family>Arimo</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>

  <alias>
    <family>Times New Roman</family>
    <prefer>
      <family>Times New Roman</family>
      <family>Liberation Serif</family>
      <family>Tinos</family>
      <family>Noto Serif</family>
    </prefer>
  </alias>

  <alias>
    <family>Courier New</family>
    <prefer>
      <family>Courier New</family>
      <family>Liberation Mono</family>
      <family>Cousine</family>
      <family>Noto Sans Mono</family>
    </prefer>
  </alias>

  <alias>
    <family>Calibri</family>
    <prefer>
      <family>Calibri</family>
      <family>Carlito</family>
      <family>Liberation Sans</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>

  <alias>
    <family>Cambria</family>
    <prefer>
      <family>Cambria</family>
      <family>Caladea</family>
      <family>Liberation Serif</family>
      <family>Noto Serif</family>
    </prefer>
  </alias>

</fontconfig>
