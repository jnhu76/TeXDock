services:
  sharelatex:
    restart: always
    image: "${TEXDOCK_FULL_IMAGE:-texdock/sharelatex-full:latest}"
    container_name: sharelatex
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "${TEXDOCK_HTTP_PORT:-80}:80"
    stop_grace_period: 60s
    volumes:
      - "${TEXDOCK_OVERLEAF_DATA_DIR:?set TEXDOCK_OVERLEAF_DATA_DIR in .env}:/var/lib/overleaf"
    environment:
      OVERLEAF_APP_NAME: "${OVERLEAF_APP_NAME:-Overleaf Community Edition}"

      OVERLEAF_MONGO_URL: "mongodb://mongo/sharelatex"

      OVERLEAF_REDIS_HOST: "redis"
      REDIS_HOST: "redis"

      ENABLED_LINKED_FILE_TYPES: "${ENABLED_LINKED_FILE_TYPES:-project_file,project_output_file}"
      ENABLE_CONVERSIONS: "${ENABLE_CONVERSIONS:-true}"
      EMAIL_CONFIRMATION_DISABLED: "${EMAIL_CONFIRMATION_DISABLED:-true}"
      OVERLEAF_SITE_LANGUAGE: "${OVERLEAF_SITE_LANGUAGE:-zh-CN}"
      MAX_COMPILE_TIMEOUT_MINUTES: "${MAX_COMPILE_TIMEOUT_MINUTES:-10}"
      TZ: "${TZ:-Asia/Shanghai}"

      # Optional settings.
      # OVERLEAF_SITE_URL: "http://your-server-ip"
      # OVERLEAF_SESSION_SECRET: "change-this-to-a-random-string"
      # OVERLEAF_NAV_TITLE: "TeXDock"
      # OVERLEAF_ADMIN_EMAIL: "admin@example.com"
      # OVERLEAF_HEADER_IMAGE_URL: "https://example.com/logo.png"
      # OVERLEAF_LEFT_FOOTER: '[{"text": "Link <a href=\"https://example.com\">here</a>"}]'
      # OVERLEAF_RIGHT_FOOTER: '[{"text": "&copy; 2025 TeXDock"}]'
      # OVERLEAF_EMAIL_FROM_ADDRESS: "texdock@example.com"
      # OVERLEAF_EMAIL_SMTP_HOST: smtp.example.com
      # OVERLEAF_EMAIL_SMTP_PORT: 587
      # OVERLEAF_EMAIL_SMTP_SECURE: false
      # OVERLEAF_EMAIL_SMTP_USER:
      # OVERLEAF_EMAIL_SMTP_PASS:
      # OVERLEAF_EMAIL_SMTP_TLS_REJECT_UNAUTH: true
      # OVERLEAF_EMAIL_SMTP_IGNORE_TLS: false
      # OVERLEAF_EMAIL_SMTP_NAME: '127.0.0.1'
      # OVERLEAF_EMAIL_SMTP_LOGGER: true
      # OVERLEAF_CUSTOM_EMAIL_FOOTER: "This system is run by department x"
      # ENABLE_CRON_RESOURCE_DELETION: true
      # ADMIN_PRIVILEGE_AVAILABLE: "true"
      # OVERLEAF_LDAP_URL: 'ldap://ldap:389'
      # OVERLEAF_LDAP_SEARCH_BASE: 'ou=people,dc=example,dc=com'
      # OVERLEAF_LDAP_SEARCH_FILTER: '(uid={{username}})'
      # OVERLEAF_LDAP_BIND_DN: 'cn=admin,dc=example,dc=com'
      # OVERLEAF_LDAP_BIND_CREDENTIALS: 'your_ldap_password'
      # OVERLEAF_LDAP_EMAIL_ATT: 'mail'
      # OVERLEAF_LDAP_NAME_ATT: 'cn'
      # OVERLEAF_LDAP_LAST_NAME_ATT: 'sn'
      # OVERLEAF_LDAP_UPDATE_USER_DETAILS_ON_LOGIN: 'true'

  mongo:
    restart: always
    image: "${TEXDOCK_MONGO_IMAGE:-mongo:8.0}"
    container_name: mongo
    command: "--replSet overleaf"
    volumes:
      - "${TEXDOCK_MONGO_DATA_DIR:?set TEXDOCK_MONGO_DATA_DIR in .env}:/data/db"
      - ./bin/shared/mongodb-init-replica-set.js:/docker-entrypoint-initdb.d/mongodb-init-replica-set.js
    environment:
      MONGO_INITDB_DATABASE: sharelatex
    extra_hosts:
      - mongo:127.0.0.1
    healthcheck:
      test: echo 'db.stats().ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5

  redis:
    restart: always
    image: "${TEXDOCK_REDIS_IMAGE:-redis:6.2}"
    container_name: redis
    volumes:
      - "${TEXDOCK_REDIS_DATA_DIR:?set TEXDOCK_REDIS_DATA_DIR in .env}:/data"
