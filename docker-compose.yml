services:
  sharelatex:
    image: fred1653/sharelatex:0.2.0
    container_name: texdock-sharelatex
    restart: unless-stopped
    depends_on:
      - mongo
      - redis
    ports:
      - "${TEXDOCK_HTTP_PORT:-8080}:80"
    env_file:
      - ./config/overleaf.env
    volumes:
      - sharelatex_data:/var/lib/overleaf
      - sharelatex_logs:/var/log/overleaf

  mongo:
    image: mongo:6.0
    container_name: texdock-mongo
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7
    container_name: texdock-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  sharelatex_data:
  sharelatex_logs:
  mongo_data:
  redis_data:
